[Config]
MinimumVersion=26~devel
Profiles=laptop

[Distribution]
Distribution=arch

[Build]
ToolsTree=default
ToolsTreeProfiles=misc,runtime,gui
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
Format=disk
ImageId=ParticleOS
ManifestFormat=json
Output=%i_%v_%a

[Content]
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=ParticleOS_*:usr-verity=ParticleOS_*:usr-verity-sig=ParticleOS_*:root=ParticleOS-*:swap=ParticleOS-*:home=ParticleOS-*
        ipe.enforce=0
InitrdProfiles=
KernelInitrdModules=default
Hostname=particle-????-????

Packages=
        base
        btrfs-progs
        chezmoi          # dotfiles
        dosfstools
        git
        helix
        linux
        linux-firmware
        mkosi
        opensc           # YubiKey
        openssh
        pkcs11-provider  # YubiKey
        systemd-ukify
        yubikey-manager  # YubiKey

RemoveFiles=
        /boot/*-ucode.img

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
SecureBootKey=pkcs11:token=Database Key;id=%%02;type=private
SecureBootKeySource=provider:pkcs11
SecureBootCertificate=pkcs11:token=Database Key;id=%%02;type=cert
SecureBootCertificateSource=provider:pkcs11
SignExpectedPcrKey=pkcs11:token=Database Key;id=%%02;type=private
SignExpectedPcrKeySource=provider:pkcs11
SignExpectedPcrCertificate=pkcs11:token=Database Key;id=%%02;type=cert
SignExpectedPcrCertificateSource=provider:pkcs11
VerityKey=pkcs11:token=Database Key;id=%%02;type=private
VerityKeySource=provider:pkcs11
VerityCertificate=pkcs11:token=Database Key;id=%%02;type=cert
VerityCertificateSource=provider:pkcs11

[Runtime]
RuntimeSize=30G
RAM=4G
CPUs=4
Ephemeral=yes
Credentials=
        passwd.plaintext-password.root=particleos
        tty.serial.hvc0.agetty.autologin=particleos
        tty.serial.hvc0.login.noauth=yes
        tty.console.agetty.autologin=particleos
        tty.console.login.noauth=yes
        tty.virtual.tty1.agetty.autologin=particleos
        tty.virtual.tty1.login.noauth=yes
